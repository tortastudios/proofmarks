name: MCP Registry

# Publishes server.json to the official MCP Registry as dev.proofmarks/proofmarks. The registry checks that npm has
# this version and that its package.json names dev.proofmarks/proofmarks, and npm only has a version once a maintainer
# approves the staged release. So run this by hand from the Actions tab after approving it. It signs in with the key
# whose public half is the v=MCPv1 TXT record on proofmarks.dev.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish to the MCP Registry
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that npm has this version, and whether the registry does
        id: versions
        run: |
          version=$(node -p "require('./server.json').version")
          if [ "$(npm view "@tortastudios/proofmarks@$version" version 2>/dev/null)" != "$version" ]; then
            echo "::error::npm doesn't have @tortastudios/proofmarks@$version yet. Approve the staged release on npmjs.com first."
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/dev.proofmarks%2Fproofmarks/versions/$version")
          echo "published=$([ "$status" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install mcp-publisher
        env:
          VERSION: 1.8.16
          SHA256: 6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v$VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$SHA256  mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      # Signing in also checks the key against the TXT record, so a run for a version that's already published still
      # proves the key works.
      - name: Publish, unless the registry already has this version
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
          PUBLISHED: ${{ steps.versions.outputs.published }}
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          key="$RUNNER_TEMP/mcp-registry.key"
          printf '%s' "$MCP_REGISTRY_KEY" > "$key"
          ./mcp-publisher login dns --domain proofmarks.dev --private-key-file "$key"
          rm -f "$key"
          if [ "$PUBLISHED" = true ]; then
            echo "::notice::The MCP Registry already has dev.proofmarks/proofmarks@$VERSION."
          else
            ./mcp-publisher publish
          fi
